name: Sentinel Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# Nunca dos applies a la vez sobre el mismo state.
concurrency:
  group: sentinel-deploy
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  TF_DIR: terraform/environments/sandbox
  # Vacío = última versión del chart. Fíjalo (p. ej. "1.14.0") para builds reproducibles.
  LBC_CHART_VERSION: ""

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.64.0

      - name: TFLint (all modules, recommended preset)
        working-directory: terraform
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl" --format compact

  terraform:
    needs: lint
    runs-on: ubuntu-latest
    outputs:
      backend_cluster: ${{ steps.tf_out.outputs.backend_cluster }}
      gateway_cluster: ${{ steps.tf_out.outputs.gateway_cluster }}
      backend_vpc: ${{ steps.tf_out.outputs.backend_vpc }}
      gateway_vpc: ${{ steps.tf_out.outputs.gateway_vpc }}
    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
    defaults:
      run:
        working-directory: ${{ env.TF_DIR }}
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.3"
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan

      - name: Get outputs
        id: tf_out
        run: |
          set -euo pipefail
          {
            echo "backend_cluster=$(terraform output -raw eks_backend_cluster_name)"
            echo "gateway_cluster=$(terraform output -raw eks_gateway_cluster_name)"
            echo "backend_vpc=$(terraform output -raw vpc_backend_id)"
            echo "gateway_vpc=$(terraform output -raw vpc_gateway_id)"
          } >> "$GITHUB_OUTPUT"

  deploy-backend:
    needs: terraform
    runs-on: ubuntu-latest
    outputs:
      backend_endpoint: ${{ steps.wait_lb.outputs.endpoint }}
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig (backend)
        run: aws eks update-kubeconfig --name "${{ needs.terraform.outputs.backend_cluster }}" --region "$AWS_REGION"

      - name: Install AWS Load Balancer Controller
        run: bash scripts/install-lbc.sh "${{ needs.terraform.outputs.backend_cluster }}" "${{ needs.terraform.outputs.backend_vpc }}" "$AWS_REGION"

      - name: Recreate Service if created before the controller
        run: bash scripts/recreate-orphan-svc.sh sentinel-backend backend-nlb

      - name: Validate backend manifests (server-side dry run)
        run: |
          # El namespace se crea de verdad: el dry run de objetos con namespace lo necesita.
          kubectl apply -f k8s/backend/00-namespace.yaml
          kubectl apply --dry-run=server -f k8s/backend/

      - name: Apply backend manifests
        run: |
          kubectl apply -f k8s/backend/
          kubectl -n sentinel-backend rollout status deployment/backend --timeout=600s

      - name: Wait for internal NLB hostname
        id: wait_lb
        run: bash scripts/wait-lb.sh sentinel-backend backend-nlb

  deploy-gateway:
    needs: [terraform, deploy-backend]
    runs-on: ubuntu-latest
    outputs:
      proxy_endpoint: ${{ steps.wait_lb.outputs.endpoint }}
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig (gateway)
        run: aws eks update-kubeconfig --name "${{ needs.terraform.outputs.gateway_cluster }}" --region "$AWS_REGION"

      - name: Install AWS Load Balancer Controller
        run: bash scripts/install-lbc.sh "${{ needs.terraform.outputs.gateway_cluster }}" "${{ needs.terraform.outputs.gateway_vpc }}" "$AWS_REGION"

      - name: Recreate Service if created before the controller
        run: bash scripts/recreate-orphan-svc.sh sentinel-gateway proxy-nlb

      - name: Render nginx config with backend endpoint
        env:
          BACKEND_ENDPOINT: ${{ needs.deploy-backend.outputs.backend_endpoint }}
        run: envsubst '$BACKEND_ENDPOINT' < k8s/gateway/01-configmap.yaml > k8s/gateway/01-configmap.rendered.yaml

      - name: Validate gateway manifests (server-side dry run)
        run: |
          kubectl apply -f k8s/gateway/00-namespace.yaml
          kubectl apply --dry-run=server \
            -f k8s/gateway/01-configmap.rendered.yaml \
            -f k8s/gateway/02-deployment.yaml \
            -f k8s/gateway/03-service.yaml

      - name: Apply gateway manifests
        run: |
          kubectl apply -f k8s/gateway/00-namespace.yaml
          CM=$(kubectl apply -f k8s/gateway/01-configmap.rendered.yaml)
          echo "$CM"
          kubectl apply -f k8s/gateway/02-deployment.yaml
          kubectl apply -f k8s/gateway/03-service.yaml
          # nginx solo lee la config al arrancar: reinicia SOLO si cambió el
          # ConfigMap. Reiniciar siempre cambiaba las IPs de los pods en cada
          # run y obligaba al NLB a registrarlos de nuevo.
          if echo "$CM" | grep -q configured; then
            kubectl -n sentinel-gateway rollout restart deployment/proxy
          fi
          # Con el readiness gate, esto espera también a que el NLB tenga los pods healthy.
          kubectl -n sentinel-gateway rollout status deployment/proxy --timeout=600s

      - name: Wait for public NLB hostname
        id: wait_lb
        run: bash scripts/wait-lb.sh sentinel-gateway proxy-nlb

  validate-e2e:
    needs: [terraform, deploy-backend, deploy-gateway]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Curl proxy -> backend end-to-end
        env:
          PROXY_ENDPOINT: ${{ needs.deploy-gateway.outputs.proxy_endpoint }}
        run: |
          TG=$(aws elbv2 describe-target-groups \
            --load-balancer-arn "$(aws elbv2 describe-load-balancers --names sentinel-gateway-nlb \
              --query 'LoadBalancers[0].LoadBalancerArn' --output text)" \
            --query 'TargetGroups[0].TargetGroupArn' --output text)
          echo "Public NLB resolves to: $(getent ahostsv4 "$PROXY_ENDPOINT" | awk '{print $1}' | sort -u | tr '\n' ' ')"
          for i in $(seq 1 40); do
            # Estado de los destinos en este momento: separa "aún no registrados" de "red".
            TARGETS=$(aws elbv2 describe-target-health --target-group-arn "$TG" \
              --query 'TargetHealthDescriptions[].[Target.Id,TargetHealth.State]' --output text | tr '\t\n' ': ' )
            # -sS: silencioso, pero muestra el error (timeout, DNS, conexión rechazada).
            RESPONSE=$(curl -sS -m 5 "http://$PROXY_ENDPOINT" 2>&1 || true)
            echo "Attempt $i [targets $TARGETS]: $RESPONSE"
            if echo "$RESPONSE" | grep -q "Hello from backend"; then
              echo "✅ End-to-end validation successful"
              exit 0
            fi
            sleep 15
          done
          echo "❌ End-to-end validation failed"
          exit 1

      # Solo si falló: separa el problema por tramos para no adivinar.
      - name: Diagnose NLBs and both legs (on failure)
        if: failure()
        env:
          GATEWAY_CLUSTER: ${{ needs.terraform.outputs.gateway_cluster }}
          BACKEND_ENDPOINT: ${{ needs.deploy-backend.outputs.backend_endpoint }}
        run: bash scripts/diagnose-e2e.sh
