apiVersion: v1
kind: Service
metadata:
  name: backend-nlb
  namespace: sentinel-backend
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "external"
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internal"
    service.beta.kubernetes.io/aws-load-balancer-name: "sentinel-backend-nlb"
spec:
  type: LoadBalancer
  # NLB interno: por defecto el controller solo abre su propia VPC (10.20.0.0/16).
  # El proxy vive en la VPC gateway y llega por el peering.
  loadBalancerSourceRanges:
    - 10.10.0.0/16
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
